/* ---------- sheet parsing (view only, first sheet) ---------- */
function inferRoles(t){t=(t||'').replace(/青团\S*/g,'');const T=t.toLowerCase(),r=[];
 if(/领唱/.test(t))r.push('Lead');if(/助唱/.test(t))r.push('Backup');if(/钢琴|司琴|助琴/.test(t))r.push('Piano');

 return r.length?r:ROLES.slice()}
function guessPartners(id,out){const t=(out[id].remarks||'').toLowerCase();if(!/安排|排我|一起/.test(t))return[];
 return Object.keys(out).filter(q=>{if(q===id)return false;const tk=out[q].name.split(/\s+/),cn=tk[0],en=tk.slice(1).map(x=>x.toLowerCase());
  return en.some(x=>x.length>=3&&t.includes(x))||(en.length>=2&&t.includes(en.slice(-2).join('')))||(cn.length>=3&&t.includes(cn.slice(-2)))})}
function parseSheet(v){const y0=+(((v[0]||[]).join(' ').match(/\d{4}/))||[2026])[0],dr=v[1]||[],wr=v[2]||[];
 let rc=wr.findIndex(x=>/remark/i.test(x||''));if(rc<0)rc=wr.length;
 let y=y0,last=0;const cols=[];
 for(let j=1;j<rc;j++){const m=/(\d+)\/(\d+)/.exec(dr[j]||'');if(!m)continue;const mo=+m[2];if(mo<last)y++;last=mo;
  if(/sun/i.test(wr[j]||''))cols.push([j,y+'-'+String(mo).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0')])}
 if(!cols.length)throw new Error('no dates');
 const out={};
 for(let r=3;r<v.length;r++){const row=v[r]||[],nm=(row[0]||'').trim();if(!nm)break;
  const av={};cols.forEach(([j,d])=>{const c=(row[j]||'').trim().toLowerCase();if(c==='yes')av[d]='Y';else if(c==='no')av[d]='N'});
  const rem=(row[rc]||'').trim();out['s'+hash(nm.split(/\s+/)[0])]={name:nm,avail:av,remarks:rem,roles:inferRoles(rem),partner:[]}}
 Object.keys(out).forEach(id=>out[id].partner=guessPartners(id,out));return out}

const firebaseConfig={apiKey:"AIzaSyAOqbTsQoYGubByF3PakBIN6VekjM5vjFc",authDomain:"cgc-pnw-roster.firebaseapp.com",projectId:"cgc-pnw-roster",storageBucket:"cgc-pnw-roster.firebasestorage.app",messagingSenderId:"477625768421",appId:"1:477625768421:web:5cff5214c1fefe23dcb70c"};

 if(canEdit){ms.forEach(m=>{if(BL[m])return;const a={};Object.keys(R).filter(k=>k.startsWith(m)).forEach(k=>a[k]=R[k]);fs.collection('baseline').doc('m'+m).set({a,v:1,at:Date.now()}).catch(fail)});

function login(){note='';auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){note='Sign-in failed ('+e.code+'). Check that this website is in Firebase → Authentication → Authorized domains.';draw()}})}
/* ---------- Google Sheet (read-only, editors only) ---------- */
const CLIENT_ID='436484108503-nrfm7luig664frpnaos0iv6fmp9uukon.apps.googleusercontent.com';
function signIn(){syncErr='';if(!window.google||!google.accounts){syncErr='Google script didn’t load. Check your connection.';draw();return}
 if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/spreadsheets.readonly',hint:user&&user.email,

  error_callback:e=>{syncErr=e&&e.type==='popup_closed'?'':'Sheet sign-in failed ('+((e&&e.type)||'error')+').';draw()}});

async function syncNow(){if(!tok||Date.now()>tokExp){tok=null;signIn();return}syncErr='';draw();
 try{const names=Object.keys(TABS),rs=['A1:AH80',...names.map(t=>t+'!A1:A80')],/* no sheet name on the first range = first sheet only */
  url='https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values:batchGet?majorDimension=ROWS&'+rs.map(r=>'ranges='+encodeURIComponent(r)).join('&'),
  res=await fetch(url,{headers:{Authorization:'Bearer '+tok}});
  if(res.status===401){tok=null;syncErr='Session expired. Press Sync Sheet again.';draw();return}

  names.forEach((t,i)=>((vr[i+1]&&vr[i+1].values)||[]).slice(1).forEach(row=>{const cn=((row&&row[0])||'').trim().split(/\s+/)[0];if(!cn)return;const id='s'+hash(cn);(m[id]=m[id]||[]).push(TABS[t])}));

  fs.collection('sheet').doc('latest').set(clean({SH,RL,rolesOk:true,at:Date.now()})).catch(fail);log(TL[tab],'Sync Sheet');draw()}catch(e){syncErr='Sync failed. Check your connection and the Sheet layout, then try again.';draw()}}
/* ---------- merge sheet + saved edits ---------- */
function rebuild(){P={};new Set([...Object.keys(SH),...Object.keys(DB)]).forEach(id=>{const s=SH[id],d=DB[id]||{};if(!s&&!d.name)return;

/* ---------- rules ---------- */
function iss(pid,d,i){const p=P[pid],h=[],s=[];if(!p)return{h,s};
 const a=p.avail[d];if(a==='B')h.push('Serving elsewhere');else if(a!=='Y')h.push('Not available');
 if(!p.roles.includes(SL[i]))h.push('Doesn’t do '+CN[i]);
 if(on(d,pid,i))h.push('Already on this Sunday');
 if(on(add(d,-7),pid,-1)||on(add(d,7),pid,-1))h.push('Back-to-back Sunday');
 if(cnt(pid,d.slice(0,7),d+'|'+i)+1>p.max)h.push('Over monthly max');
 const nth=Math.ceil(+d.slice(8)/7);if(p.nth.length&&!p.nth.includes(nth))h.push('Only Sunday '+p.nth.join('/')+' of month');
 for(const q of Object.keys(P))if(q!==pid&&on(d,q,-1)&&(P[q].avoid.includes(pid)||p.avoid.includes(q)))h.push('Avoid '+P[q].name.split(/\s+/)[0]);
 p.partner.forEach(q=>{if(P[q]&&!on(d,q,-1))s.push('Wants '+P[q].name.split(/\s+/)[0])});return{h,s}}
function draft(){if(!canEdit||LK[ym])return;const added={},yr=ym.slice(0,4),el=(d,i)=>Object.keys(P).filter(q=>!iss(q,d,i).h.length);

  for(const i of order){const c=el(d,i);if(!c.length)continue;

   c.sort((a,b)=>sc(a)-sc(b));R[d+'|'+i]=c[0];added[d+'|'+i]=c[0]}}pushRoster(added);log('Roster','Auto-filled empty slots ('+monLabel(ym)+')');draw()}

  h+='</table></section>'}
 h+=`<section><h3>Services per person</h3><table><tr><th>Name</th><th>This month</th><th>${ym.slice(0,4)}</th></tr>`;
 ids().forEach(q=>{h+=`<tr><td>${esc(P[q].name)}</td><td>${cnt(q,ym)} / ${P[q].max}</td><td>${cnt(q,ym.slice(0,4))}</td></tr>`});return h+'</table></section>'}
function vAvail(){const ds=suns(ym);if(!ids().length)return'<div class="empty">No people yet.</div>';const L={Y:'Yes',N:'No',B:'Busy','':'·'};
 let h='<p class="n">Values come from the Sheet. Tap a cell to change it (Yes → No → Busy → blank). Changed cells have a blue outline and stay in the app; the Sheet is never edited.</p><div class="sc"><table><tr><th>Name</th>'+ds.map(d=>`<th>${fmt(d)}</th>`).join('')+'</tr>';
 ids().forEach(q=>{const ov=(DB[q]||{}).ov||{};h+=`<tr><td>${esc(P[q].name)}</td>`+ds.map(d=>{const v=P[q].avail[d]||'';return`<td><button class="c c${v}${d in ov?' ed':''}" data-a="av" data-p="${q}" data-d="${d}">${L[v]}</button></td>`}).join('')+'</tr>'});return h+'</table></div>'}
function vPeople(){return'<div class="bar"><button data-a="new">+ Add person</button></div><p class="n">Roles come from the role tabs in the Sheet (vocal_main, vocal_sub, piano, drum, bass, pa, ppt). Partners are guessed from Remarks. Fix anything here; your changes are kept.</p><div id="plist">'+peopleList()+'</div>'}
function peopleList(){const chk=(f,p,q)=>`<details${od===q+f?' open':''}><summary>${f==='partner'?'Prefers to serve with':'Never serves with'} (${p[f].length})</summary>${ids().filter(x=>x!==q).map(x=>`<label class="k"><input type="checkbox" data-a="pm" data-f="${f}" data-o="${x}" data-p="${q}"${p[f].includes(x)?' checked':''}> ${esc(P[x].name)}</label>`).join('')}</details>`;
 let h='';
 if(!ids().length)return h+'<div class="empty">No one yet.</div>';
 ids().filter(q=>!pq||P[q].name.toLowerCase().includes(pq)).forEach(q=>{const p=P[q];h+=`<section><div class="bar"><input data-a="pf" data-f="name" data-p="${q}" value="${esc(p.name)}" aria-label="Name"${p.sheet?' disabled':''}>${p.sheet?'<span class="tag">from Sheet</span>':''}${p.sheet&&!p.roles.length?'<span class="tag" style="color:var(--wn);border-color:var(--wn)">no role in Sheet</span>':''}<label class="k">Max/month <input type="number" min="1" max="5" style="width:56px" data-a="pf" data-f="max" data-p="${q}" value="${p.max}"></label><button class="g" data-a="del" data-p="${q}">${arm===q?'Sure? Tap again':p.sheet?'Reset my edits':'Remove'}</button></div>
 <div>${ROLES.map(r=>`<label class="k"><input type="checkbox" data-a="role" data-r="${r}" data-p="${q}"${p.roles.includes(r)?' checked':''}> ${r}</label>`).join('')}</div>
 <div class="bar" style="margin:8px 0 0">${chk('partner',p,q)}${chk('avoid',p,q)}</div>
 <div style="margin-top:6px"><span class="sub">Only these Sundays of the month (none ticked = any): </span>${[1,2,3,4,5].map(n=>`<label class="k"><input type="checkbox" data-a="nth" data-n="${n}" data-p="${q}"${p.nth.includes(n)?' checked':''}> ${n}</label>`).join('')}</div>
 <input style="width:100%;margin-top:8px" placeholder="Remarks" data-a="pf" data-f="remarks" data-p="${q}" value="${esc(p.remarks)}"></section>`});return h||'<div class="empty">No one matches “'+esc(pqRaw)+'”.</div>'}
function vPreview(ms){const sel=pvList();
 const info=showCh?'<p class="n">Highlighted = Recent update (names changed since the first export). '+sel.map(m=>monLabel(m)+': '+(BL[m]?'compared with the first export':'no export yet, nothing to compare')).join(' · ')+'</p>':'';
 return'<section><h3>Months to preview</h3><div>'+ms.map(m=>`<label class="k"><input type="checkbox" data-a="pvm" data-m="${m}"${sel.includes(m)?' checked':''}> ${monLabel(m)}</label>`).join('')+'</div><div class="bar" style="margin:10px 0 0"><label class="k"><input type="checkbox" data-a="chg"'+(showCh?' checked':'')+'> Show Changes</label><span class="dd"><button data-a="dd">Export As ▾</button>'+(ddOpen?'<div class="ddm"><button data-a="exp" data-k="pdf">PDF</button><button data-a="exp" data-k="jpg">JPG</button></div>':'')+'</span></div>'+info+'</section>'+(sel.length?'<div class="sc"><div class="pvw">'+previewTable(sel,showCh)+'</div></div>':'<div class="empty">Pick at least one month.</div>')}
function previewTable(mons,ch){const upd=Math.max(0,...mons.map(m=>RU[m]||0))||Date.now();
 let h='<table class="pvt"><colgroup><col style="width:'+(110/1230*100)+'%">'+SL.map(()=>'<col style="width:'+(140/1230*100)+'%">').join('')+'</colgroup><tr><th>日期</th><th>领唱</th><th colspan="2">助唱</th><th>司琴</th><th>贝斯</th><th>鼓手</th><th>音响</th><th>PPT</th></tr>';
 mons.forEach(m=>{h+='<tr><td class="bn" colspan="9">'+monLabel(m)+'</td></tr>';const bl=ch&&BL[m]&&BL[m].a;
  suns(m).forEach(d=>{h+='<tr><td>'+(+d.slice(8))+'-'+MN[+d.slice(5,7)-1]+'</td>'+SL.map((_,i)=>{const q=at(d,i),c=bl&&q&&bl[d+'|'+i]!==q;return'<td'+(c?' class="hl"':'')+'>'+(q&&P[q]?esc(P[q].name.split(/\s+/)[0]):'')+'</td>'}).join('')+'</tr>'})});
 return h+'</table><div class="pvf"><span class="hlt">'+(ch?'Highlighted = Recent update':'')+'</span><span>Updated at: '+fmtU(upd)+'</span></div>'}
function vLog(){if(!LG.length)return'<div class="empty">No activity yet.</div>';const g={};LG.forEach(x=>{const d=fmtDay(x.t);(g[d]=g[d]||[]).push(x)});
 return Object.keys(g).sort().reverse().map(d=>`<section><button class="dayh" data-a="logday" data-d="${d}">${logOpen.has(d)?'▾':'▸'} ${d} <span class="sub">(${g[d].length})</span></button>${logOpen.has(d)?'<div class="loglist">'+g[d].slice().reverse().map(x=>`<div class="ll">${esc(fmtDT(x.t)+' ['+x.u+'] '+x.tab+': '+x.msg)}</div>`).join('')+'</div>':''}</section>`).join('')}
function draw(){
 if(!authReady){$('#app').innerHTML='<div class="empty">Loading…</div>';return}
 const bn=note?`<div class="ban">${esc(note)}</div>`:'';
 if(!user){$('#app').innerHTML=bn+'<section class="empty"><p>Sign in with the Google account your leaders added.</p><div class="bar" style="justify-content:center"><button data-a="login">Sign in with Google</button></div></section>';return}
 if(denied){$('#app').innerHTML=bn+`<section class="empty"><p>No access for <b>${esc(user.email)}</b>.</p><p class="sub">Ask a leader to add this email to the access list.</p><div class="bar" style="justify-content:center"><button data-a="logout">Sign out</button></div></section>`;return}
 const today=curMonth();
 const ms=[...new Set([...Object.values(P).flatMap(p=>Object.keys(p.avail)),...Object.keys(R)].map(k=>k.slice(0,7)).concat(today))].sort();
 if(!ym||!ms.includes(ym))ym=today;
 if(tab==='log'&&!canEdit)tab='roster';
 const mo=ms.map(m=>`<option value="${m}"${m===ym?' selected':''}>${monLabel(m)}</option>`).join('');
 const T=[['roster','Roster'],['avail','Availability'],['people','People'],['preview','Preview']];if(canEdit)T.push(['log','Log']);
 const st=syncErr?syncErr:syncAt?'Sheet synced '+syncAt.toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Sheet not synced yet';
 const fsw=h=>`<fieldset${canEdit?'':' disabled'} style="border:0;padding:0;margin:0;min-width:0">${h}</fieldset>`;
 const body=tab==='roster'?fsw(vRoster()):tab==='avail'?fsw(vAvail()):tab==='people'?`<input id="psearch" type="search" autocomplete="off" placeholder="Search name…" data-a="search" value="${esc(pqRaw)}" style="width:100%;margin-bottom:12px">`+fsw(vPeople()):tab==='preview'?vPreview(ms):vLog();
 const ae=document.activeElement,keep=ae&&ae.id==='psearch'?[ae.selectionStart,ae.selectionEnd]:null;
 $('#app').innerHTML=bn+`<div class="bar"><span class="sub" style="margin:0">${esc(user.email)} · ${canEdit?'Editor':'View only'} · ${esc(st)}</span>${canEdit?'<button class="g" data-a="sync">Sync Sheet</button>':''}<button class="g" data-a="logout">Sign out</button></div><nav>${T.map(t=>`<button data-a="tab" data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('')}${tab==='roster'||tab==='avail'?`<select data-a="month" style="margin-left:auto">${mo}</select>`:''}</nav>`+body;
 if(keep){const el=document.getElementById('psearch');if(el){el.focus();try{el.setSelectionRange(keep[0],keep[1])}catch(e){}}}}
/* ---------- PDF (canvas → JPEG → PDF, so Chinese names render) ---------- */
function sheetCanvas(mons,ch){
 const cw=[110,...SL.map(()=>140)],W=cw.reduce((a,b)=>a+b,0),HH=48,RH=48,FH=46,xs=[0];cw.forEach(w=>xs.push(xs[xs.length-1]+w));
 const rows=[];mons.forEach(m=>{rows.push({b:monLabel(m)});suns(m).forEach(d=>rows.push({d,m}))});
 const H=HH+rows.length*RH,S=2,cv=document.createElement('canvas');cv.width=W*S;cv.height=(H+FH+4)*S;const c=cv.getContext('2d');c.scale(S,S);
 c.fillStyle='#fff';c.fillRect(0,0,W,H+FH+4);c.translate(0,2);c.strokeStyle='#000';c.lineWidth=1.2;c.textAlign='center';c.textBaseline='middle';
 const F='"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Sans SC","Heiti SC",sans-serif',ln=(x1,y1,x2,y2)=>{c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()};
 c.fillStyle='#d9d9d9';c.fillRect(0,0,W,HH);c.fillStyle='#000';c.font='bold 22px '+F;
 const hd=['日期','领唱','助唱',null,'司琴','贝斯','鼓手','音响','PPT'];hd.forEach((t,i)=>{if(!t)return;const x2=t==='助唱'?xs[i+2]:xs[i+1];c.fillText(t,(xs[i]+x2)/2,HH/2)});
 xs.forEach((x,i)=>{if(i!==3)ln(x,0,x,HH)});ln(0,HH,W,HH);ln(0,0,W,0);
 let y=HH;c.font='22px '+F;
 rows.forEach(r=>{if(r.b){c.fillStyle='#d9d9d9';c.fillRect(0,y,W,RH);c.fillStyle='#000';c.fillText(r.b,W/2,y+RH/2);ln(0,y,0,y+RH);ln(W,y,W,y+RH)}
  else{c.fillStyle='#000';c.fillText(+r.d.slice(8)+'-'+MN[+r.d.slice(5,7)-1],cw[0]/2,y+RH/2);
   const bl=ch&&BL[r.m]&&BL[r.m].a;
   SL.forEach((_,i)=>{const q=at(r.d,i),x=xs[i+1];if(bl&&q&&bl[r.d+'|'+i]!==q){c.fillStyle='#ffe066';c.fillRect(x+1,y+1,cw[i+1]-2,RH-2)}
    c.fillStyle='#000';if(q&&P[q])c.fillText(P[q].name.split(/\s+/)[0],x+cw[i+1]/2,y+RH/2)});xs.forEach(x=>ln(x,y,x,y+RH))}
  ln(0,y+RH,W,y+RH);y+=RH});
 const upd=Math.max(0,...mons.map(m=>RU[m]||0))||Date.now();
 c.font='15px '+F;c.fillStyle='#444';c.textAlign='right';c.fillText('Updated at: '+fmtU(upd),W-8,H+FH/2);
 if(ch){c.textAlign='left';c.fillStyle='#8a6d00';c.fillText('Highlighted = Recent update',8,H+FH/2)}
 return cv}
async function makePdf(cv){const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.93)),jpg=new Uint8Array(await blob.arrayBuffer());
 const pw=842,m=28,w=pw-2*m,h=w*cv.height/cv.width,ph=Math.ceil(Math.max(595,h+2*m));
 const x=(pw-w)/2,y=ph-m-h,e=s=>new TextEncoder().encode(s),parts=[],off=[];let len=0;const push=b=>{parts.push(b);len+=b.length};
 push(e('%PDF-1.4\n'));const obj=(n,b)=>{off[n]=len;push(e(n+' 0 obj\n'+b+'\nendobj\n'))};
 obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Kids[3 0 R]/Count 1>>');
 obj(3,`<</Type/Page/Parent 2 0 R/MediaBox[0 0 ${pw} ${ph}]/Resources<</XObject<</Im0 4 0 R>>>>/Contents 5 0 R>>`);
 off[4]=len;push(e(`4 0 obj\n<</Type/XObject/Subtype/Image/Width ${cv.width}/Height ${cv.height}/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length ${jpg.length}>>\nstream\n`));push(jpg);push(e('\nendstream\nendobj\n'));
 const cs=`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${y.toFixed(2)} cm /Im0 Do Q`;obj(5,`<</Length ${cs.length}>>\nstream\n${cs}\nendstream`);
 const xp=len;let xr='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)xr+=String(off[i]).padStart(10,'0')+' 00000 n \n';
 push(e(xr+'trailer\n<</Size 6/Root 1 0 R>>\nstartxref\n'+xp+'\n%%EOF'));return new Blob(parts,{type:'application/pdf'})}
/* ---------- events ---------- */
document.addEventListener('click',async e=>{if(ddOpen&&!e.target.closest('.dd')){ddOpen=false;draw()}const b=e.target.closest('button[data-a]');if(!b)return;const a=b.dataset.a;
 if(a==='login')login();else if(a==='logout')auth.signOut();
 else if(a==='tab'){tab=b.dataset.t;note='';if(tab==='roster')ym=curMonth();draw()}
 else if(a==='lock')toggleLock();
 else if(a==='dd'){ddOpen=!ddOpen;draw()}
 else if(a==='exp')doExport(b.dataset.k)
 else if(a==='logday'){const d=b.dataset.d;logOpen.has(d)?logOpen.delete(d):logOpen.add(d);draw()}else if(a==='draft')draft();
 else if(a==='clear')clearMonth();
 else if(a==='sync'){tok&&Date.now()<tokExp?syncNow():signIn()}
 else if(a==='av'){const id=b.dataset.p,d=b.dataset.d,cur=P[id].avail[d]||'',nx={'':'Y',Y:'N',N:'B',B:''}[cur],base=(SH[id]&&SH[id].avail[d])||'',ov=Object.assign({},(DB[id]||{}).ov);nx===base?delete ov[d]:ov[d]=nx;patch(id,{ov});log('Availability',`Updated ${ord(+d.slice(8))} ${P[id].name} - '${LB[cur]}' to '${LB[nx]}' (${monLabel(d.slice(0,7))})`)}
 else if(a==='new'){log('People','Added a new person');patch('p'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),{name:'New person',roles:[],max:3,partner:[],avoid:[],ov:{}})}
 else if(a==='del'){const q=b.dataset.p;if(arm!==q){arm=q;draw();return}arm='';const nm=P[q]?P[q].name:q,was=P[q]&&P[q].sheet;delete DB[q];if(canEdit){fs.collection('people').doc(q).delete().catch(fail);log('People',(was?'Reset edits for ':'Removed ')+nm)}rebuild();draw()}});
document.addEventListener('change',e=>{const t=e.target,a=t.dataset.a;if(!a)return;const id=t.dataset.p;
 if(a==='month'){ym=t.value;draw()}
 else if(a==='set'){const k=t.dataset.k,sp=k.split('|'),o=R[k],nv=t.value;slot(k,nv);log('Roster',`Updated ${ord(+sp[0].slice(8))} ${CN[sp[1]]} - '${o&&P[o]?P[o].name:'empty'}' to '${nv&&P[nv]?P[nv].name:'empty'}' (${monLabel(sp[0].slice(0,7))})`)}
 else if(a==='pvm'){const st=new Set(pvList());t.checked?st.add(t.dataset.m):st.delete(t.dataset.m);pvSel=[...st].sort();draw()}
 else if(a==='chg'){showCh=t.checked;draw()}
 else if(a==='pf'){const f=t.dataset.f;patch(id,{[f]:f==='max'?Math.max(1,+t.value||3):t.value});if(P[id])log('People','Updated '+P[id].name)}
 else if(a==='role'){const s=new Set(P[id].roles);t.checked?s.add(t.dataset.r):s.delete(t.dataset.r);patch(id,{roles:[...s]});log('People','Updated '+P[id].name)}
 else if(a==='pm'){const f=t.dataset.f,s=new Set(P[id][f]);od=id+f;t.checked?s.add(t.dataset.o):s.delete(t.dataset.o);patch(id,{[f]:[...s]});log('People','Updated '+P[id].name)}
 else if(a==='nth'){const s=new Set(P[id].nth),n=+t.dataset.n;t.checked?s.add(n):s.delete(n);patch(id,{nth:[...s].sort()});log('People','Updated '+P[id].name)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.a==='search'){pqRaw=t.value;pq=t.value.trim().toLowerCase();const el=document.getElementById('plist');if(el)el.innerHTML=peopleList()}});
/* ---------- start ---------- */
draw();
auth.onAuthStateChanged(u=>{unsub.forEach(f=>f());unsub=[];user=u;authReady=true;canEdit=false;denied=false;logOn=false;LG=[];BL={};RU={};LK={};
 if(!u){P={};R={};DB={};SH={};RL={};draw();return}
 const err=e=>{if(e&&e.code==='permission-denied')denied=true;else note='Connection problem. Reload the page.';draw()};
 unsub.push(fs.collection('config').doc('access').onSnapshot(()=>{canEdit=true;startLog();draw()},()=>{canEdit=false;draw()}));
 unsub.push(fs.collection('people').onSnapshot(q=>{denied=false;DB={};q.docs.forEach(d=>DB[d.id]=d.data());rebuild();draw()},err));
 unsub.push(fs.collection('roster').onSnapshot(q=>{R={};RU={};LK={};q.docs.forEach(d=>{const j=d.data();Object.assign(R,j.a||{});RU[d.id.slice(1)]=j.u||0;LK[d.id.slice(1)]=!!j.lk});draw()},err));
 unsub.push(fs.collection('baseline').onSnapshot(q=>{BL={};q.docs.forEach(d=>BL[d.id.slice(1)]=d.data());draw()},()=>{}));
 unsub.push(fs.collection('sheet').doc('latest').onSnapshot(d=>{if(d.exists){const j=d.data();SH=j.SH||{};RL=j.RL||{};rolesOk=!!j.rolesOk;syncAt=j.at?new Date(j.at):null;rebuild();draw()}},()=>{}));
 draw()});
</script></body></html>
