const ids=()=>Object.keys(P).sort((a,b)=>{const x=P[a].ord,y=P[b].ord,hx=x!=null,hy=y!=null;if(hx&&hy)return x-y;if(hx!==hy)return hx?-1:1;return P[a].name.localeCompare(P[b].name,'zh')});

/* ---------- sheet parsing (view only, first sheet) ---------- */
function inferRoles(t){t=(t||'').replace(/青团\S*/g,'');const T=t.toLowerCase(),r=[];
 if(/领唱/.test(t))r.push('Lead');if(/助唱/.test(t))r.push('Backup');if(/钢琴|司琴|助琴/.test(t))r.push('Piano');
 if(/bass|贝斯/.test(T))r.push('Bass');if(/drum|鼓/.test(T))r.push('Drum');if(/\bpa\b|音响/.test(T))r.push('PA');if(/ppt/.test(T))r.push('PPT');
 return r.length?r:ROLES.slice()}
function guessPartners(id,out){const t=(out[id].remarks||'').toLowerCase();if(!/安排|排我|一起/.test(t))return[];
 return Object.keys(out).filter(q=>{if(q===id)return false;const tk=out[q].name.split(/\s+/),cn=tk[0],en=tk.slice(1).map(x=>x.toLowerCase());
  return en.some(x=>x.length>=3&&t.includes(x))||(en.length>=2&&t.includes(en.slice(-2).join('')))||(cn.length>=3&&t.includes(cn.slice(-2)))})}
function parseSheet(v){const y0=+(((v[0]||[]).join(' ').match(/\d{4}/))||[2026])[0],dr=v[1]||[],wr=v[2]||[];
 let rc=wr.findIndex(x=>/remark/i.test(x||''));if(rc<0)rc=wr.length;
 let y=y0,last=0;const cols=[];
 for(let j=1;j<rc;j++){const m=/(\d+)\/(\d+)/.exec(dr[j]||'');if(!m)continue;const mo=+m[2];if(mo<last)y++;last=mo;
  if(/sun/i.test(wr[j]||''))cols.push([j,y+'-'+String(mo).padStart(2,'0')+'-'+String(+m[1]).padStart(2,'0')])}
 if(!cols.length)throw new Error('no dates');
 const out={};
 for(let r=3;r<v.length;r++){const row=v[r]||[],nm=(row[0]||'').trim();if(!nm)break;
  const av={};cols.forEach(([j,d])=>{const c=(row[j]||'').trim().toLowerCase();if(c==='yes')av[d]='Y';else if(c==='no')av[d]='N'});
  const rem=(row[rc]||'').trim();out['s'+hash(nm.split(/\s+/)[0])]={name:nm,avail:av,remarks:rem,roles:inferRoles(rem),partner:[],ord:r}}
 Object.keys(out).forEach(id=>out[id].partner=guessPartners(id,out));return out}
/* ---------- Firebase (shared data) ---------- */
const firebaseConfig={apiKey:"AIzaSyAOqbTsQoYGubByF3PakBIN6VekjM5vjFc",authDomain:"cgc-pnw-roster.firebaseapp.com",projectId:"cgc-pnw-roster",storageBucket:"cgc-pnw-roster.firebasestorage.app",messagingSenderId:"477625768421",appId:"1:477625768421:web:5cff5214c1fefe23dcb70c"};
const TABS={vocal_main:'Lead',vocal_sub:'Backup',piano:'Piano',drum:'Drum',bass:'Bass',pa:'PA',ppt:'PPT'};
let user=null,canEdit=false,denied=false,authReady=false,unsub=[],RU={},LK={},BL={},LG=[],logOpen=new Set(),pvSel=null,pvVer={},showCh=false,ddOpen=false,pq='',pqRaw='',logOn=false;
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),fs=firebase.firestore(),FV=firebase.firestore.FieldValue;
const clean=o=>JSON.parse(JSON.stringify(o));
const fail=()=>{note='Couldn’t save. You may not have edit access, or you are offline.';draw()};
const uid=()=>user&&user.email?user.email.split('@')[0]:'unknown';
function log(tabName,msg){if(!canEdit)return;fs.collection('logs').add({t:Date.now(),u:uid(),tab:tabName,msg}).catch(()=>{})}
function startLog(){if(logOn)return;logOn=true;unsub.push(fs.collection('logs').orderBy('t','desc').limit(500).onSnapshot(q=>{LG=q.docs.map(d=>d.data());draw()},()=>{}))}
const pvList=()=>(pvSel||[curMonth()]).slice().sort();
function dlBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function refreshDay(d){if(!canEdit||LK[d.slice(0,7)])return;
 const yr=d.slice(0,4),old=SL.map((_,i)=>at(d,i)||''),S=SL.map((_,i)=>i).filter(i=>old[i]);   /* only slots that already have a name */
 if(!S.length){note='Nothing to refresh on '+fmt(d)+'. No names are selected.';draw();return}
 SL.forEach((_,i)=>{delete R[d+'|'+i]});
 const pids=Object.keys(P),base={};pids.forEach(q=>base[q]=cnt(q,yr));
 const el={},elS={};S.forEach(i=>{el[i]=pids.filter(q=>!iss(q,d,i).h.length);elS[i]=new Set(el[i])});
 const avoid=(a,b)=>P[a]&&P[b]&&(P[a].avoid.includes(b)||P[b].avoid.includes(a)),order=S.slice().sort((a,b)=>el[a].length-el[b].length);
 const cur={};let best=null,bestV=-1,bestOk=-1,nodes=0,done=false;
 const val=()=>{let v=0,k=0,pb=0,fa=0;const st=new Set(S.map(i=>cur[i]));
  S.forEach(i=>{const q=cur[i];if(elS[i].has(q))v++;if(q===old[i])k++;fa+=base[q]||0;if(P[q])P[q].partner.forEach(x=>{if(st.has(x))pb++})});return v*10000+k*500+pb*40-fa};
 const go=(k,okc)=>{if(done||++nodes>40000||okc+order.length-k<bestOk)return;
  if(k===order.length){const v=val();if(v>bestV){bestV=v;best=Object.assign({},cur);bestOk=okc;if(v>=S.length*10500)done=true}return}
  const i=order[k],used=Object.values(cur),c=el[i].filter(q=>!used.includes(q)&&!used.some(u=>avoid(q,u)));

  for(const q of c){cur[i]=q;go(k+1,okc+1);if(done||nodes>40000)break}

 const upd={};let mv=0;
 S.forEach(i=>{const key=d+'|'+i,nw=best[i];R[key]=nw;if(nw!==old[i]){upd[key]=nw;mv++}});

  log('Roster','Refreshed '+ord(+d.slice(8))+' - switched '+mv+' slot(s), '+bad.length+' still can’t serve ('+monLabel(mo)+')')}

 draw()}
function toggleLock(){if(!canEdit)return;LK[ym]=!LK[ym];fs.collection('roster').doc('m'+ym).set({lk:!!LK[ym]},{merge:true}).catch(fail);log('Roster',(LK[ym]?'Locked':'Unlocked')+' month ('+monLabel(ym)+')');draw()}

 try{if(kind==='pdf')dlBlob(await makePdf(cv),'PnW-schedule.pdf');else dlBlob(await new Promise(r=>cv.toBlob(r,'image/jpeg',.93)),'PnW-schedule.jpg')}catch(x){note='Couldn’t create the file.';draw();return}
 if(canEdit){const labs=[];ms.forEach(m=>{const sel=pvVer[m]||'latest',vl=verList(m),nums=vNums(m),last=nums[nums.length-1];

function login(){note='';auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{if(e.code!=='auth/popup-closed-by-user'&&e.code!=='auth/cancelled-popup-request'){note='Sign-in failed ('+e.code+'). Check that this website is in Firebase → Authentication → Authorized domains.';draw()}})}
/* ---------- Google Sheet (read-only, editors only) ---------- */
const CLIENT_ID='436484108503-nrfm7luig664frpnaos0iv6fmp9uukon.apps.googleusercontent.com';
function signIn(){syncErr='';if(!window.google||!google.accounts){syncErr='Google script didn’t load. Check your connection.';draw();return}
 if(!tc)tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:'https://www.googleapis.com/auth/spreadsheets.readonly',hint:user&&user.email,
  callback:r=>{if(r.error){syncErr='Sheet sign-in failed ('+r.error+').';draw();return}tok=r.access_token;tokExp=Date.now()+(r.expires_in-60)*1000;syncNow()},
  error_callback:e=>{syncErr=e&&e.type==='popup_closed'?'':'Sheet sign-in failed ('+((e&&e.type)||'error')+').';draw()}});

async function syncNow(){if(!tok||Date.now()>tokExp){tok=null;signIn();return}syncErr='';draw();
 try{const names=Object.keys(TABS),rs=['A1:AH80',...names.map(t=>t+'!A1:A80')],/* no sheet name on the first range = first sheet only */
  url='https://sheets.googleapis.com/v4/spreadsheets/'+SID+'/values:batchGet?majorDimension=ROWS&'+rs.map(r=>'ranges='+encodeURIComponent(r)).join('&'),
  res=await fetch(url,{headers:{Authorization:'Bearer '+tok}});

  if(!res.ok)throw new Error(res.status);
  const vr=(await res.json()).valueRanges||[];const sh=parseSheet((vr[0]&&vr[0].values)||[]),m={};
  names.forEach((t,i)=>((vr[i+1]&&vr[i+1].values)||[]).slice(1).forEach(row=>{const cn=((row&&row[0])||'').trim().split(/\s+/)[0];if(!cn)return;const id='s'+hash(cn);(m[id]=m[id]||[]).push(TABS[t])}));
  SH=sh;RL=m;rolesOk=true;syncAt=new Date();rebuild();

 ds.forEach(d=>SL.forEach((_,i)=>{const q=at(d,i);if(q&&P[q]){const h=iss(q,d,i).h;if(h.length)L.push(fmt(d)+' '+CN[i]+' '+nmOf(q)+': '+h.join(', '))}}));
 return L.length?'Problems in '+monLabel(ym)+':\n'+L.join('\n'):'No problems found in '+monLabel(ym)+'.'}
function chatClick(c){
 if(c==='close'){CH.open=false;chatVis()}
 else if(c==='clear'){CH.msgs=[];CH.hist=[];CH.pending=null;aliasReset();renderChat()}
 else if(c==='send'){const i=document.getElementById('cinput');if(i){const v=i.value;i.value='';chatSend(v)}}
 else if(c==='ok')chatApply();
 else if(c==='no'){CH.pending=null;addMsg('a','Cancelled.')}
 else if(c==='prep')chatSend('Apply the changes you suggested above.');
 else if(c==='q-rot')chatSend('Check role rotation for this month: who repeats the same role, who is underused, whether anyone breaks the rest or monthly rules, and whether Auto-fill is good enough or I should adjust by hand.');
 else if(c.indexOf('q-')===0){addMsg('a',quick(c.slice(2)))}}
function renderChat(){const m=document.getElementById('cmsgs');if(!m)return;
 let h=CH.msgs.length?'':'<div class="sub">Ask me to check rotation, availability or conflicts. I explain my reasoning first and only prepare changes when you ask (for example “swap …” or “apply”). You always confirm before anything changes. Quick commands: “refresh 10/25”, “lock”, “unlock”.</div>';
 CH.msgs.forEach(x=>{h+='<div class="cm '+(x.r==='u'?'cu':'ca')+'">'+esc(x.t)+'</div>'});
 if(CH.pending){const p=CH.pending;h+='<div class="cm ca"><b>Confirm these changes?</b>'+p.items.map(it=>'<div>• '+esc(it.text)+it.warn.map(w=>' <span class="r">⚠ '+esc(w)+'</span>').join('')+'</div>').join('')+p.errors.map(e=>'<div class="sub">'+esc(e)+'</div>').join('')+'<div class="bar" style="margin:8px 0 0"><button data-c="ok">Confirm</button><button class="g" data-c="no">Cancel</button></div></div>'}
 if(CH.offer&&!CH.pending&&!CH.busy)h+='<div class="bar" style="margin:4px 0"><button data-c="prep">Prepare these changes</button><span class="sub">Only if you want me to act on the answer above.</span></div>';
 if(CH.busy)h+='<div class="cm ca sub">Thinking…</div>';
 m.innerHTML=h;m.scrollTop=m.scrollHeight;
 const mo=document.getElementById('cmon');if(mo)mo.textContent=' · '+monLabel(ym)}
function chatInit(){const fab=document.createElement('button');fab.className='cfab';fab.textContent='💬';fab.title='Assistant';fab.style.display='none';
 fab.addEventListener('click',()=>{CH.open=!CH.open;chatVis()});
 const root=document.createElement('div');root.className='cpanel';root.style.display='none';
 root.innerHTML='<div class="ch"><b>Assistant</b><span class="sub" id="cmon"></span><span class="cx"><button data-c="clear" title="Clear chat">🗑</button><button data-c="close" title="Close">✕</button></span></div><div class="cmsgs" id="cmsgs"></div><div class="cq"><button data-c="q-rot">Check rotation</button><button data-c="q-empty">Empty slots</button><button data-c="q-count">Counts</button><button data-c="q-prob">Problems</button></div><div class="cin"><input id="cinput" maxlength="300" placeholder="Ask or change something…" autocomplete="off"><button data-c="send">Send</button></div>';
 root.addEventListener('click',e=>{const b=e.target.closest('button[data-c]');if(b)chatClick(b.dataset.c)});
 root.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cinput'){e.preventDefault();chatClick('send')}});
 document.body.appendChild(fab);document.body.appendChild(root);CH.fab=fab;CH.root=root}
function chatVis(){if(!CH.root)return;const ok=!!(user&&canEdit&&!denied);CH.fab.style.display=ok?'block':'none';if(!ok)CH.open=false;CH.root.style.display=ok&&CH.open?'flex':'none';if(ok&&CH.open)renderChat()}
/* ---------- start ---------- */
chatInit();
draw();
auth.onAuthStateChanged(u=>{unsub.forEach(f=>f());unsub=[];user=u;authReady=true;canEdit=false;denied=false;logOn=false;LG=[];BL={};RU={};LK={};
 if(!u){P={};R={};DB={};SH={};RL={};draw();return}
 const err=e=>{if(e&&e.code==='permission-denied')denied=true;else note='Connection problem. Reload the page.';draw()};
 unsub.push(fs.collection('config').doc('access').onSnapshot(()=>{canEdit=true;startLog();draw()},()=>{canEdit=false;draw()}));
 unsub.push(fs.collection('people').onSnapshot(q=>{denied=false;DB={};q.docs.forEach(d=>DB[d.id]=d.data());rebuild();draw()},err));
 unsub.push(fs.collection('roster').onSnapshot(q=>{R={};RU={};LK={};q.docs.forEach(d=>{const j=d.data();Object.assign(R,j.a||{});RU[d.id.slice(1)]=j.u||0;LK[d.id.slice(1)]=!!j.lk});draw()},err));
 unsub.push(fs.collection('baseline').onSnapshot(q=>{BL={};q.docs.forEach(d=>BL[d.id.slice(1)]=d.data());draw()},()=>{}));
 unsub.push(fs.collection('sheet').doc('latest').onSnapshot(d=>{if(d.exists){const j=d.data();SH=j.SH||{};RL=j.RL||{};rolesOk=!!j.rolesOk;syncAt=j.at?new Date(j.at):null;rebuild();draw()}},()=>{}));
 draw()});
</script></body></html>
